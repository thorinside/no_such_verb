# BMAD v6 Workflow Map
# Complete workflow orchestration map extracted from BMAD-METHOD v6-alpha branch
# Source: https://github.com/anthropics/BMAD-METHOD (v6-alpha branch)
# Generated: 2025-01-19

version: v6

# Claude Code slash command loading patterns for v6
# Pattern: /bmad:bmm:agents:{agent-id} *{trigger} {args}
# Agents can be loaded with commands in one invocation
claude_code_loading:
  agents:
    - command: /bmad:bmm:agents:analyst
      invocation_pattern: "/bmad:bmm:agents:analyst *{trigger} {args}"
    - command: /bmad:bmm:agents:architect
      invocation_pattern: "/bmad:bmm:agents:architect *{trigger} {args}"
    - command: /bmad:bmm:agents:dev
      invocation_pattern: "/bmad:bmm:agents:dev *{trigger} {args}"
    - command: /bmad:bmm:agents:pm
      invocation_pattern: "/bmad:bmm:agents:pm *{trigger} {args}"
    - command: /bmad:bmm:agents:sm
      invocation_pattern: "/bmad:bmm:agents:sm *{trigger} {args}"
    - command: /bmad:bmm:agents:tea
      invocation_pattern: "/bmad:bmm:agents:tea *{trigger} {args}"
    - command: /bmad:bmm:agents:ux-expert
      invocation_pattern: "/bmad:bmm:agents:ux-expert *{trigger} {args}"

  workflows:
    - /bmad:bmm:workflows:dev-story
    - /bmad:bmm:workflows:review-story
    - /bmad:bmm:workflows:story-approved
    - /bmad:bmm:workflows:create-story
    - /bmad:bmm:workflows:story-ready

  invocation_examples:
    - "/bmad:bmm:agents:dev *develop 3.1"
    - "/bmad:bmm:agents:dev *review 3.1"
    - "/bmad:bmm:agents:dev *story-approved 3.1"
    - "/bmad:bmm:agents:sm *create-story"
    - "/bmad:bmm:agents:sm *story-ready 3.1"

  subagents:
    - bmm-requirements-analyst
    - bmm-user-journey-mapper
    - bmm-epic-optimizer
    - bmm-technical-decisions-curator
    - bmm-data-analyst
    - bmm-trend-spotter
    - bmm-user-researcher
    - bmm-market-researcher
    - bmm-technical-evaluator
    - bmm-document-reviewer
    - bmm-codebase-analyzer
    - bmm-dependency-mapper
    - bmm-pattern-detector
    - bmm-tech-debt-auditor
    - bmm-api-documenter
    - bmm-test-coverage-analyzer

