# State machine rules for story workflow
# Maps story status to next agent/command
state_machine:
  # Story creation phase
  "Draft":
    agent: sm
    command: story-ready
    description: Story needs SM approval before development

  # Development phase
  "Approved":
    agent: dev
    command: develop
    description: Story approved by PO/SM, ready for DEV implementation

  "Ready for Development":
    agent: dev
    command: develop
    description: Story approved, ready for implementation

  "In Progress":
    agent: dev
    command: develop
    description: Story currently being implemented

  # Review phase
  "Ready for Review":
    agent: dev
    command: review
    description: Implementation complete, perform self-review

  # Approval phase
  "Review Passed":
    agent: dev
    command: story-approved
    description: Review approved, mark story done

  "Ready for Done":
    agent: dev
    command: story-approved
    description: Final validation complete, mark done

  # Terminal states
  "Done":
    agent: null
    command: null
    description: Story complete, move to next

  "Blocked":
    agent: null
    command: null
    description: Requires user intervention

# Expected state transitions after running workflows
expected_transitions:
  develop:
    input_status: ["Approved", "Ready for Development", "In Progress"]
    output_status: ["Ready for Review", "In Progress"]
    notes: "May complete in one iteration or require multiple passes"

  review:
    input_status: ["Ready for Review"]
    output_status: ["Review Passed", "In Progress"]
    notes: "Review Passed if approved, In Progress if changes requested"

  story-approved:
    input_status: ["Review Passed", "Ready for Done"]
    output_status: ["Done"]
    notes: "Final step marking story complete and updating workflow status"

  story-ready:
    input_status: ["Draft"]
    output_status: ["Approved", "Ready for Development"]
    notes: "SM or PO marks draft ready for DEV (Approved or Ready for Development)"

  create-story:
    input_status: ["N/A"]
    output_status: ["Draft"]
    notes: "SM creates new draft story with context"

# Orchestration rules for LLM decision making
orchestration_rules:
  - 'If story status is "Done", return action: "complete"'
  - 'If story status is "Blocked", return action: "halt" with reasoning'
  - 'If agent output says story already complete/reviewed, verify status before routing'
  - 'If agent output explicitly suggests next command (e.g. "Run *story-approved"), strongly consider it'
  - 'Never run same workflow twice if agent confirms work already complete'
  - 'Use state_machine as default routing but allow intelligent overrides with clear reasoning'
  - 'If iteration exceeds max_iterations, return action: "halt" to prevent infinite loops'
  - 'Check for HALT indicators in agent output (blocking issues, missing dependencies)'

# Agent output patterns to detect
agent_patterns:
  completion_indicators:
    - "Story [\\d.]+ complete"
    - "Status: Done"
    - "All acceptance criteria met"
    - "Implementation complete"
    - "Story [\\d.]+ Implementation Complete"

  suggestions:
    - "Run `\\*(\\w+) ([\\d.]+)`"
    - "Command to run: `\\*(\\w+)`"
    - "Next: \\*(\\w+)"
    - "Would you like me to run `\\*(\\w+)`"
    - "run `\\*(\\w+-?\\w*) ([\\d.]+)`"

  halt_indicators:
    - "HALT"
    - "cannot proceed"
    - "blocked"
    - "requires user input"
    - "Cannot Be Approved"
    - "missing dependencies"

  already_complete:
    - "already complete"
    - "already reviewed"
    - "already approved"
    - "Status: Done"
    - "Status: Review Passed"

# BMAD v6 workflow phases (for context)
workflow_phases:
  - number: 1
    name: Analysis
    primary_agents: [analyst, pm]
    outputs: [product-brief, research]

  - number: 2
    name: Planning
    primary_agents: [pm, architect]
    outputs: [prd, architecture]

  - number: 3
    name: Solutioning
    primary_agents: [architect]
    outputs: [solution-architecture, tech-spec]

  - number: 4
    name: Implementation
    primary_agents: [sm, dev, tea]
    outputs: [stories, tests, code]

  - number: 5
    name: Deployment
    primary_agents: [dev, tea]
    outputs: [deployed-system]

# Extension notes
notes: |
  This workflow map is generated from BMAD v6 agent definitions.

  To add a new agent:
  1. Create agent.yaml file in bmad/bmm/agents/
  2. Regenerate this map with generator script
  3. No orchestrator code changes needed

  To modify workflow rules:
  1. Update state_machine for new status values
  2. Update expected_transitions for new commands
  3. Test with LLM orchestrator
  4. Refine orchestration_rules if needed

  Game-specific agents (game-architect, game-designer, game-dev) are available
  but not included in state_machine as they follow project-specific workflows.

  Claude Code Integration:
  - v6 uses namespaced slash commands: /bmad:bmm:agents:{agent-id}
  - Workflows can also be directly invoked: /bmad:bmm:workflows:{workflow-name}

  Command invocation patterns:
  - Two-step: "/bmad:bmm:agents:dev" (load agent) then "*develop 3.1" (execute)
  - One-step: "/bmad:bmm:agents:dev *develop 3.1" (load AND execute immediately)

  Orchestra should use one-step invocation:
  - Pattern: "/bmad:bmm:agents:{agent} *{trigger} {args}"
  - Example: "/bmad:bmm:agents:dev *develop 3.1"
  - Example: "/bmad:bmm:agents:sm *create-story"
  - Example: "/bmad:bmm:agents:dev *story-approved 3.1"

  Subagents:
  - v6 includes specialized subagents (bmm-requirements-analyst, bmm-data-analyst, etc.)
  - These are Claude Code Task agents that can be called from within main agents
  - Used for specialized analysis during workflow execution
  - Installed to .claude/agents/ during BMAD installation
