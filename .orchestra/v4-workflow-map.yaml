# BMAD v4 Workflow Map
# Complete workflow orchestration map extracted from BMAD-METHOD main branch
# Source: https://github.com/anthropics/BMAD-METHOD (main branch)
# Generated: 2025-01-19

version: v4

# Claude Code slash command loading patterns for v4
# Pattern: /BMad:agents:{agent-id} (note capital B)
# Also has short aliases: /{agent-id}
# Can pass menu commands after slash: /dev *develop-story 3.1
claude_code_loading:
  agents:
    - command: /BMad:agents:analyst
      alias: /analyst
      invocation_pattern: "/analyst *{trigger} {args}"
    - command: /BMad:agents:architect
      alias: /architect
      invocation_pattern: "/architect *{trigger} {args}"
    - command: /BMad:agents:bmad-master
      alias: /bmad-master
      invocation_pattern: "/bmad-master *{trigger} {args}"
    - command: /BMad:agents:bmad-orchestrator
      alias: /bmad-orchestrator
      invocation_pattern: "/bmad-orchestrator *{trigger} {args}"
    - command: /BMad:agents:dev
      alias: /dev
      invocation_pattern: "/dev *{trigger} {args}"
    - command: /BMad:agents:pm
      alias: /pm
      invocation_pattern: "/pm *{trigger} {args}"
    - command: /BMad:agents:qa
      alias: /qa
      invocation_pattern: "/qa *{trigger} {args}"
    - command: /BMad:agents:po
      alias: /po
      invocation_pattern: "/po *{trigger} {args}"
    - command: /BMad:agents:sm
      alias: /sm
      invocation_pattern: "/sm *{trigger} {args}"
    - command: /BMad:agents:ux-expert
      alias: /ux-expert
      invocation_pattern: "/ux-expert *{trigger} {args}"

  tasks:
    - /BMad:tasks:develop-story
    - /BMad:tasks:review-story
    - /BMad:tasks:qa-gate
    - /BMad:tasks:apply-qa-fixes
    - /BMad:tasks:create-next-story
    - /BMad:tasks:validate-next-story

  invocation_examples:
    - "/dev *develop-story 3.1"
    - "/qa *review 3.1"
    - "/sm *draft"
    - "/po *validate-story-draft story-3.1.md"

